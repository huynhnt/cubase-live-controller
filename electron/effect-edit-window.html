<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cấu hình Hiệu ứng</title>
  <style>
    :root {
      --bg-main: #191919;
      --bg-panel: #222222;
      --text-main: #ecf0f1;
      --text-secondary: #95a5a6;
      --border-color: rgba(255, 255, 255, 0.1);
      
      --color-blue: #3498db;
      --color-blue-hover: #2980b9;
      --color-red: #e74c3c;
      --color-red-hover: #c0392b;
      --color-green: #2ecc71;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    
    .titlebar {
      height: 32px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 12px;
      -webkit-app-region: drag; /* Cho phép kéo thả cửa sổ */
      user-select: none;
    }
    
    .titlebar-text {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--color-blue);
    }
    
    .titlebar-close {
      margin-left: auto;
      -webkit-app-region: no-drag;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-secondary);
      padding: 0 4px;
    }
    
    .titlebar-close:hover {
      color: var(--color-red);
    }
    
    .content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    
    .settings-row {
      margin-bottom: 12px;
    }
    
    label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: block;
    }
    
    input[type="text"], input[type="number"], select {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    
    input:focus, select:focus {
      border-color: var(--color-blue);
    }
    
    .footer {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.15);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .btn {
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.15s ease;
    }
    
    .btn-blue {
      background: var(--color-blue);
      color: white;
    }
    
    .btn-blue:hover {
      background: var(--color-blue-hover);
    }
    
    .btn-red {
      background: var(--color-red);
      color: white;
    }
    
    .btn-red:hover {
      background: var(--color-red-hover);
    }
    
    .btn-sec {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }
    
    .btn-sec:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-text">CẤU HÌNH HIỆU ỨNG</div>
    <div class="titlebar-close" id="btn-close">✕</div>
  </div>
  
  <div class="content">
    <input type="hidden" id="input-fx-id">
    
    <div class="settings-row">
      <label for="input-fx-name">Tên Hiệu ứng</label>
      <input type="text" id="input-fx-name" placeholder="Ví dụ: Vang, Delay..." maxlength="20">
    </div>
    
    <div class="settings-row" style="display: flex; gap: 10px;">
      <div style="flex: 1;">
        <label>Màu sắc</label>
        <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
          <div class="color-swatch" data-color="orange" style="width: 20px; height: 20px; border-radius: 4px; background: #f39c12; cursor: pointer; border: 2px solid transparent;"></div>
          <div class="color-swatch" data-color="yellow" style="width: 20px; height: 20px; border-radius: 4px; background: #f1c40f; cursor: pointer; border: 2px solid transparent;"></div>
          <div class="color-swatch" data-color="purple" style="width: 20px; height: 20px; border-radius: 4px; background: #9b59b6; cursor: pointer; border: 2px solid transparent;"></div>
          <div class="color-swatch" data-color="red" style="width: 20px; height: 20px; border-radius: 4px; background: #e74c3c; cursor: pointer; border: 2px solid transparent;"></div>
          <div class="color-swatch" data-color="blue" style="width: 20px; height: 20px; border-radius: 4px; background: #3498db; cursor: pointer; border: 2px solid transparent;"></div>
          <div class="color-swatch" data-color="teal" style="width: 20px; height: 20px; border-radius: 4px; background: #1abc9c; cursor: pointer; border: 2px solid transparent;"></div>
          <div class="color-swatch" data-color="pink" style="width: 20px; height: 20px; border-radius: 4px; background: #e84393; cursor: pointer; border: 2px solid transparent;"></div>
          <div class="color-swatch" data-color="green" style="width: 20px; height: 20px; border-radius: 4px; background: #2ecc71; cursor: pointer; border: 2px solid transparent;"></div>
          <div class="color-swatch" data-color="grey" style="width: 20px; height: 20px; border-radius: 4px; background: #95a5a6; cursor: pointer; border: 2px solid transparent;"></div>
          <input type="color" id="input-fx-color" value="#3498db" style="width: 20px; height: 20px; padding: 0; border: none; cursor: pointer; border-radius: 4px; background: transparent;" title="Chọn màu tùy ý">
        </div>
        <input type="hidden" id="hidden-fx-color" value="orange">
      </div>
      <div style="flex: 1;">
        <label>Cho phép Bật/Tắt hiệu ứng này</label>
        <label class="switch-container" style="display: flex; align-items: center; margin-top: 8px; cursor: pointer;">
          <input type="checkbox" id="checkbox-has-toggle" style="display: none;" checked>
          <div id="ui-has-toggle" style="width: 36px; height: 20px; background: #2ecc71; border-radius: 10px; position: relative; transition: 0.2s;">
            <div id="ui-knob-toggle" style="width: 16px; height: 16px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 18px; transition: 0.2s;"></div>
          </div>
          <span style="font-size: 11px; margin-left: 8px; color: var(--text-secondary);" id="ui-text-toggle">CÓ</span>
        </label>
      </div>
    </div>
    
    <div class="settings-row" style="display: flex; gap: 10px;">
      <div style="flex: 1;">
        <label for="input-fx-cc">Mã CC Giá trị (Số CC của thanh kéo)</label>
        <input type="number" id="input-fx-cc" min="0" max="127" value="0">
        <small style="color: var(--text-secondary); font-size: 11px;">Khuyên dùng: 20-63</small>
      </div>
      <div style="flex: 1;">
        <label for="input-fx-toggle-cc" title="Mã CC dùng để Bật/Tắt (Mute) hiệu ứng này">Mã CC Bật/Tắt (Công tắc)</label>
        <input type="number" id="input-fx-toggle-cc" min="-1" max="127" value="-1">
        <small style="color: var(--text-secondary); font-size: 11px;">Khuyên dùng: 102-119</small>
      </div>
    </div>
    
    <div class="settings-row">
      <label for="select-fx-format">Định dạng hiển thị (Giá trị kéo)</label>
      <select id="select-fx-format">
        <option value="db">Chuẩn Cubase (-∞ đến +6dB)</option>
        <option value="percent">Phần trăm (0 - 100%)</option>
        <option value="custom">Tuỳ biến (Dành cho AutoTune...)</option>
      </select>
    </div>
    
    <div class="settings-row" id="fx-custom-range" style="display: none; gap: 10px;">
      <div style="flex: 1;">
        <label for="input-fx-min">Giá trị Min</label>
        <input type="number" id="input-fx-min" value="0">
      </div>
      <div style="flex: 1;">
        <label for="input-fx-max">Giá trị Max</label>
        <input type="number" id="input-fx-max" value="100">
      </div>
    </div>
    
    <div class="settings-row">
      <label for="input-fx-value">Giá trị mặc định ban đầu</label>
      <input type="number" id="input-fx-value" min="0" max="127" value="24">
      <small style="color: var(--text-secondary); font-size: 11px;">Đây là mức âm lượng/giá trị sẽ được gán cho toàn bộ các Preset khi hiệu ứng này mới được tạo ra.</small>
    </div>
  </div>
  
  <div class="footer">
    <button id="btn-fx-delete" class="btn btn-red" style="display: none;">Xóa</button>
    <div style="display: flex; gap: 8px; margin-left: auto;">
      <button id="btn-fx-cancel" class="btn btn-sec">Hủy</button>
      <button id="btn-fx-save" class="btn btn-blue">Lưu Lại</button>
    </div>
  </div>

  <script src="./effect-edit.js"></script>
</body>
</html>
